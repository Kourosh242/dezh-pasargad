# Dezh-e Pasargad — Gradle configuration
# Constrained for low-memory build machines and CI runners.
org.gradle.jvmargs=-Xmx576m -XX:MaxMetaspaceSize=448m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=40 -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# Low-memory hosts: run Kotlin compilation inside the Gradle daemon
kotlin.compiler.execution.strategy=in-process

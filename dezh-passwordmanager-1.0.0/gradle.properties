# Dezh-e Pasargad — Gradle configuration
# Constrained for the ~2GB sandbox (kernel OOM-kill evidence in dmesg across phases).
org.gradle.jvmargs=-Xmx576m -XX:MaxMetaspaceSize=448m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=40 -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# 2 CPU cores / ~2GB RAM sandbox: run Kotlin compilation inside the Gradle daemon
kotlin.compiler.execution.strategy=in-process

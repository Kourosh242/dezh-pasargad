# Dezh-e Pasargad — detekt overrides on top of default config.
# Rationale: a crypto/security codebase legitimately contains magic-looking
# constants (key sizes, wire-format offsets, backoff steps) and long
# constructor signatures for explicit dependency injection.

complexity:
  LongMethod:
    active: true
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: true
    thresholdInClasses: 14
    thresholdInInterfaces: 14
    thresholdInObjects: 14

style:
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2', '3', '4', '8', '16', '17', '24', '32', '64', '128', '256', '512', '1000']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    active: true
    maxLineLength: 160
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'

exceptions:
  TooGenericExceptionCaught:
    active: true
    allowedExceptionNameRegex: '(_|(ignored|expected).*|e|t)'
